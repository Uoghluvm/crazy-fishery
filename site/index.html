<script>
(() => {
  'use strict';

  // ---------------- 数据 ----------------
  const CAT = {
    attack:   { name:'攻击', color:'#e0624a' },
    resource: { name:'资源', color:'#3fb37a' },
    skill:    { name:'技能', color:'#4b8fd6' },
    special:  { name:'奇妙', color:'#9b7ae0' }
  };

  // 效果描述：{to, filter, op, v, per?, tag}
  //   to     : adjacent 上下左右 | range 3×3 | row 整行 | col 整列 | all 全船 | self 自身
  //   filter : any | attack | resource | skill | special | 具体建筑 id
  //   op     : add 固定加成 | mult 倍率
  //   per    : 按该范围内的目标数量叠乘（用于"每有 1 个邻居 +N"）
  const BUILDINGS = [
    { id:'ballista', name:'弩炮',   cat:'attack',   base:10, desc:'基础攻击建筑，本身没有位置效果。', effects:[] },
    { id:'harpoon',  name:'鱼叉',   cat:'attack',   base:6,  desc:'低数值攻击建筑，适合铺边角。', effects:[] },
    { id:'ratling',  name:'鼠炮台', cat:'attack',   base:4,  desc:'每有 1 个相邻建筑，自身 +3。挤得越密越强。', effects:[{to:'self',per:'adjacent',filter:'any',op:'add',v:3,tag:'每邻+3'}] },
    { id:'powder',   name:'火药桶', cat:'attack',   base:0,  desc:'相邻攻击建筑 ×1.3，但相邻资源建筑 −2。双刃。', effects:[{to:'adjacent',filter:'attack',op:'mult',v:1.3,tag:'攻×1.3'},{to:'adjacent',filter:'resource',op:'add',v:-2,tag:'资−2'}] },
    { id:'net',      name:'捕鱼网', cat:'resource', base:5,  desc:'资源产出，本身没有位置效果。', effects:[] },
    { id:'purifier', name:'净化器', cat:'resource', base:4,  desc:'资源产出，本身没有位置效果。', effects:[] },
    { id:'trawl',    name:'拖网',   cat:'resource', base:3,  desc:'同一行的其他资源建筑 ×1.5。横着铺才有效。', effects:[{to:'row',filter:'resource',op:'mult',v:1.5,tag:'同行×1.5'}] },
    { id:'still',    name:'蒸馏塔', cat:'resource', base:6,  desc:'同一列的攻击建筑 +2。竖着铺才有效。', effects:[{to:'col',filter:'attack',op:'add',v:2,tag:'同列+2'}] },
    { id:'ammo',     name:'弹药架', cat:'skill',    base:0,  desc:'相邻（上下左右）的攻击建筑 +5。', effects:[{to:'adjacent',filter:'attack',op:'add',v:5,tag:'+5'}] },
    { id:'shield',   name:'护盾塔', cat:'skill',    base:3,  desc:'提供护盾数值，本身没有位置效果。', effects:[] },
    { id:'frost',    name:'冰雾灯', cat:'skill',    base:0,  desc:'全船护盾塔 +2。护盾流派的核心放大器。', effects:[{to:'all',filter:'shield',op:'add',v:2,tag:'盾+2'}] },
    { id:'beacon',   name:'灯塔',   cat:'special',  base:0,  desc:'相邻（上下左右）的建筑 ×1.5。', effects:[{to:'adjacent',filter:'any',op:'mult',v:1.5,tag:'×1.5'}] },
    { id:'coral',    name:'珊瑚礁', cat:'special',  base:3,  desc:'周围 3×3 范围（含斜向）的其他建筑 +2。', effects:[{to:'range',filter:'any',op:'add',v:2,tag:'+2'}] },
    { id:'tidemark', name:'潮汐钟', cat:'special',  base:0,  desc:'全船其他建筑 +2。占一格不产出，但谁都能吃。', effects:[{to:'all',filter:'any',op:'add',v:2,tag:'全体+2'}] },
    { id:'tidegate', name:'潮汐闸', cat:'special',  base:0,  desc:'规则：护盾当一整池用。跨轮不再清零，最多攒到单轮护盾的 2 倍；按整池抵扣，但每轮最多挡下 3/4 的命中。穿影依旧无视护盾。', effects:[], rule:'shieldCarry' },
    { id:'chain',   name:'链式弩', cat:'attack',   base:12, desc:'进阶武器，等级解锁。相邻攻击建筑 +2。', effects:[{to:'adjacent',filter:'attack',op:'add',v:2,tag:'邻攻+2'}], unlock:2 },
    { id:'mortar',  name:'震爆炮', cat:'attack',   base:20, desc:'进阶武器，等级解锁。沉重而有力。', effects:[], unlock:3 },
    { id:'doom',    name:'灭神炮', cat:'attack',   base:36, desc:'终极武器，等级解锁。一炮顶一队。', effects:[], unlock:4 }
  ];

  // 兼容旧数据：只有 effect 字符串时按此映射成通用效果
  const LEGACY_EFFECTS = {
    adjacent_attack_flat:[{to:'adjacent',filter:'attack',op:'add',v:5,tag:'+5'}],
    adjacent_mult:[{to:'adjacent',filter:'any',op:'mult',v:1.5,tag:'×1.5'}],
    range_flat:[{to:'range',filter:'any',op:'add',v:2,tag:'+2'}]
  };
  function effectsOf(b) {
    if (!b) return [];
    if (b.effects) return b.effects;
    return LEGACY_EFFECTS[b.effect] || [];
  }
  // 格子里显示的辅助建筑标记：范围前缀 + 数值
  const SCOPE_MARK = { adjacent:'', range:'周', row:'横', col:'竖', all:'全', self:'自' };
  // 规则型建筑不产出数值，格子里显示规则缩写，避免出现一个无意义的「—」
  const RULE_BADGE = { shieldCarry:'盾续' };
  function effectBadge(b) {
    const e = effectsOf(b)[0];
    if (!e) return '—';
    const op = e.op === 'mult' ? '×' + e.v : (e.v > 0 ? '+' + e.v : String(e.v));
    return (SCOPE_MARK[e.to] || '') + op;
  }
  const MAP = Object.fromEntries(BUILDINGS.map(b => [b.id, b]));
  const ICON = { ballista:'ic-ballista', harpoon:'ic-harpoon', net:'ic-net', purifier:'ic-purifier',
                 ammo:'ic-ammo', beacon:'ic-beacon', coral:'ic-coral', shield:'ic-shield',
                 tidegate:'ic-tidegate', chain:'ic-chain', mortar:'ic-mortar', doom:'ic-doom' };

  const SIZES = [ {n:3, cell:112}, {n:4, cell:92}, {n:5, cell:76} ];

  // ---------------- 状态 ----------------
  const COST = {ballista:8,harpoon:5,net:6,purifier:5,ammo:8,beacon:14,coral:12,shield:10,ratling:9,powder:11,trawl:7,still:9,frost:12,tidemark:16,tidegate:18,chain:11,mortar:24,doom:46};
  const SAVE_KEY='crazy-fishery.save.v1';
  const SAVE_VERSION=2;
  const REGIONS=['珊瑚浅湾','漂木海峡','雾礁航道','沉船深海','巨兽海沟'];
  let savedGame=null, lastSaved='', saveMessage='', guideEnabled=true;
  let stock = {};
  let pity = 0;
  let run = null; // null = free-build sandbox; adventure rules are deliberately separate.
  let sizeIdx = 0;
  let N = SIZES[sizeIdx].n;
  const cells = new Map();          // "x,y" -> buildingId
  let removing = false;
  let moving = false;               // 移动模式：先点建筑，再点目标格
  let held = null;                  // 已拿起的建筑 {x,y}
  let undoStack = [];               // 整备撤销栈，进入新一天时清空，避免倒退战斗奖励
  let conflictSave = null;          // 另一窗口写入的不同进度
  const UNDO_MAX = 20;
  let soundEnabled = true;
  let selected = null;              // buildingId
  let hover = null;                 // {x,y}
  let cellEls = new Map();          // "x,y" -> element
  let noGhostKey = null;            // 刚拆除的格：鼠标未移开前不显示预览，避免"好像没删掉"

  const $ = s => document.querySelector(s);
  const key = (x, y) => x + ',' + y;

  // 可复现的随机：同一 seed 同一串结果。出问题把 seed 报出来就能重放这一局。
  // 用 xorshift32 而不是线性同余——后者的相邻种子前几十个输出几乎一样，做复现没意义。
  const mixSeed = v => { let x=(v>>>0)||1; x^=x<<13; x>>>=17; x^=x<<5; return (x>>>0)||1; };
  let seedState = mixSeed(Date.now()>>>0);
  function rnd() {
    let x=seedState; x^=x<<13; x>>>=17; x^=x<<5;
    seedState=(x>>>0)||1;
    return seedState/4294967296;
  }

  const gridEl = $('#grid');
  const formulaEl = $('#formula');
  const statsEl = $('#stats');

  // ---------------- 查询辅助 ----------------
  function neighbors(x, y) {
    const out = [];
    if (x > 0) out.push([x - 1, y]);
    if (x < N - 1) out.push([x + 1, y]);
    if (y > 0) out.push([x, y - 1]);
    if (y < N - 1) out.push([x, y + 1]);
    return out;
  }

  function rangeCells(x, y) {
    const out = [];
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        out.push([nx, ny]);
      }
    }
    return out;
  }

  let preview = null;   // {x, y, id}

  function buildingAt(x, y) {
    if (preview && preview.x === x && preview.y === y) return MAP[preview.id];
    const id = cells.get(key(x, y));
    return id ? MAP[id] : null;
  }

  // ---------------- 结算 ----------------
  function compute() {
    const flat = new Map(), mult = new Map(), total = new Map();

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        flat.set(key(x, y), 0);
        mult.set(key(x, y), 1);
      }
    }

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const b = buildingAt(x, y);
        if (!b) continue;

        for (const eff of effectsOf(b)) {
          const v = effectValue(eff, x, y);
          if (v === 0) continue;
          for (const [tx, ty] of scopeCells(eff.to, x, y)) {
            if (!matchFilter(buildingAt(tx, ty), eff.filter)) continue;
            const k = key(tx, ty);
            if (eff.op === 'mult') mult.set(k, mult.get(k) * v);
            else flat.set(k, flat.get(k) + v);
          }
        }
      }
    }

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const b = buildingAt(x, y);
        const k = key(x, y);
        total.set(k, b ? (b.base + flat.get(k)) * mult.get(k) : 0);
      }
    }
    return { flat, mult, total };
  }

  function scopeCells(to, x, y) {
    if (to === 'self') return [[x, y]];
    if (to === 'adjacent') return neighbors(x, y);
    if (to === 'range') return rangeCells(x, y).filter(([nx, ny]) => nx !== x || ny !== y);
    if (to === 'all') {
      const out = [];
      for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) if (xx !== x || yy !== y) out.push([xx, yy]);
      return out;
    }
    if (to === 'row' || to === 'col') {
      const out = [];
      for (let i = 0; i < N; i++) {
        const nx = to === 'row' ? i : x, ny = to === 'row' ? y : i;
        if (nx !== x || ny !== y) out.push([nx, ny]);
      }
      return out;
    }
    return [];
  }
  function matchFilter(b, filter) {
    if (!b) return false;
    if (!filter || filter === 'any') return true;
    return b.cat === filter || b.id === filter;
  }
  function effectValue(eff, x, y) {
    if (!eff.per) return eff.v;
    const n = scopeCells(eff.per, x, y).filter(([px, py]) => matchFilter(buildingAt(px, py), eff.filter)).length;
    return eff.v * n;
  }
  function effectTargets(x, y) {
    const b = buildingAt(x, y);
    if (!b) return [];
    const out = new Set();
    for (const eff of effectsOf(b)) {
      if (effectValue(eff, x, y) === 0) continue;
      for (const [tx, ty] of scopeCells(eff.to, x, y)) {
        if (matchFilter(buildingAt(tx, ty), eff.filter)) out.add(key(tx, ty));
      }
    }
    return [...out];
  }

  function contributors(x, y) {
    const out = [];
    const self = buildingAt(x, y);
    for (let yy = 0; yy < N; yy++) {
      for (let xx = 0; xx < N; xx++) {
        if (xx === x && yy === y) continue;
        const b = buildingAt(xx, yy);
        if (!b) continue;
        for (const eff of effectsOf(b)) {
          const v = effectValue(eff, xx, yy);
          if (v === 0) continue;
          if (!scopeCells(eff.to, xx, yy).some(([tx, ty]) => tx === x && ty === y)) continue;
          if (!matchFilter(self, eff.filter)) continue;
          out.push(b.name + ' ' + (eff.tag || (eff.op === 'mult' ? '×' + v : (v > 0 ? '+' : '') + v)));
        }
      }
    }
    return out;
  }

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let unit = 112;
  const point = (x,y) => ({x:(x-y+N-1)*unit/2, y:(x+y)*unit*.32});
  function model(id) {

  // ---------------- 音效 ----------------
  // 全部实时合成，不加载任何音频文件：包体不增加，离线打开也能出声。
  // 每个事件都带节流，避免一轮齐射里多座弩炮同时触发把音量顶爆。
  const SFX = (() => {
    let ctx = null, bus = null, noiseBuf = null, ambience = null, enabled = true;
    const lastAt = {};
    const GAP = { ui:50, place:60, remove:60, swap:60, pick:60, loot:80, cannon:80, splash:140, enemyHit:60, hullHit:80, error:400 };

    function ensure() {
      if (ctx) return ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        ctx = new AC();
        // 压缩器当限幅用：连续爆点也不会削爆扬声器
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 5;
        comp.attack.value = .004; comp.release.value = .22;
        bus = ctx.createGain(); bus.gain.value = enabled ? .85 : 0;
        bus.connect(comp).connect(ctx.destination);
      } catch { ctx = null; }
      return ctx;
    }
    // freq→to 的滑音；gain 用指数包络收尾，避免爆音
    function tone(freq, o = {}) {
      if (!ctx) return;
      const { to = freq, type = 'sine', dur = .18, gain = .12, delay = 0, attack = .006, detune = 0 } = o;
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type; osc.detune.value = detune;
      osc.frequency.setValueAtTime(freq, t);
      if (to !== freq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002, gain), t + attack);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      osc.connect(g).connect(bus);
      osc.start(t); osc.stop(t + dur + .02);
    }
    function noiseBuffer() {
      if (noiseBuf) return noiseBuf;
      const len = Math.floor(ctx.sampleRate * 1);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return noiseBuf;
    }
    // 白噪声经滤波＝木头、水花、炮口、船体这些"非乐音"的质感
    function noise(o = {}) {
      if (!ctx) return;
      const { dur = .2, gain = .1, delay = 0, type = 'lowpass', freq = 1000, to = null, q = 1, attack = .005 } = o;
      const t = ctx.currentTime + delay;
      const src = ctx.createBufferSource(); src.buffer = noiseBuffer();
      const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(freq, t);
      if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002, gain), t + attack);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(f).connect(g).connect(bus);
      src.start(t, Math.random() * .4); src.stop(t + dur + .02);
    }

    const VOICES = {
      ui() { tone(880, { type:'triangle', to:1040, dur:.05, gain:.045 }); },
      open() { noise({ dur:.24, gain:.045, type:'bandpass', freq:620, to:1700, q:.9 }); },
      close() { noise({ dur:.2, gain:.035, type:'bandpass', freq:1600, to:520, q:.9 }); },
      pick() { tone(560, { type:'triangle', to:840, dur:.09, gain:.07 }); tone(900, { to:1260, dur:.11, gain:.05, delay:.05 }); },
      place() { tone(150, { type:'triangle', to:68, dur:.12, gain:.15 }); noise({ dur:.09, gain:.06, freq:1500, to:400 }); },
      remove() { tone(210, { type:'triangle', to:62, dur:.2, gain:.13 }); noise({ dur:.15, gain:.05, freq:900, to:260 }); },
      swap() { tone(300, { type:'triangle', to:190, dur:.09, gain:.09 }); tone(300, { type:'triangle', to:430, dur:.1, gain:.06, delay:.07 }); },
      undo() { tone(330, { type:'triangle', to:560, dur:.11, gain:.07 }); noise({ dur:.1, gain:.03, freq:1200, to:600 }); },
      repair() { [0, .11, .22].forEach((d, i) => { noise({ dur:.05, gain:.07, freq:2400, to:800, delay:d }); tone(520 - i * 40, { type:'square', to:240, dur:.07, gain:.045, delay:d }); }); },
      cannon() { noise({ dur:.24, gain:.13, freq:1300, to:200 }); tone(96, { to:36, dur:.3, gain:.2 }); },
      splash() { noise({ dur:.18, gain:.05, type:'highpass', freq:900, to:2400 }); },
      enemyHit() { noise({ dur:.15, gain:.09, freq:1700, to:420 }); tone(220, { type:'sawtooth', to:105, dur:.14, gain:.05 }); },
      hullHit() { tone(74, { to:34, dur:.3, gain:.22 }); noise({ dur:.2, gain:.08, freq:520, to:120 }); },
      shield() { tone(1380, { to:2060, dur:.16, gain:.05 }); tone(2060, { to:1540, dur:.2, gain:.035, delay:.02 }); },
      heal() { tone(420, { to:700, dur:.22, gain:.07 }); tone(700, { to:980, dur:.24, gain:.05, delay:.12 }); },
      error() { tone(150, { type:'square', dur:.09, gain:.05 }); tone(118, { type:'square', dur:.13, gain:.05, delay:.12 }); },
      loot() { [1046, 1318, 1568].forEach((f, i) => tone(f, { type:'triangle', dur:.16, gain:.055, delay:i * .06 })); },
      levelup() { [659, 880, 1046, 1318].forEach((f, i) => tone(f, { type:'triangle', dur:.24, gain:.07, delay:i * .09 })); },
      day() { tone(523, { dur:.3, gain:.07 }); tone(784, { dur:.36, gain:.05, delay:.1 }); noise({ dur:.5, gain:.03, type:'bandpass', freq:600, to:1200, q:.8 }); },
      sail() { noise({ dur:.8, gain:.05, freq:1200, to:320 }); tone(196, { to:262, dur:.5, gain:.05 }); },
      victory() { [523, 659, 784, 1046].forEach((f, i) => tone(f, { type:'triangle', dur:.28, gain:.075, delay:i * .11 })); },
      bossVictory() { [392, 523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, { type:'triangle', dur:.4, gain:.075, delay:i * .13 })); },
      defeat() { [392, 330, 262, 196].forEach((f, i) => tone(f, { dur:.42, gain:.09, delay:i * .14 })); },
      boss() { noise({ dur:1.4, gain:.09, freq:240, to:90, q:1.8 }); tone(58, { to:38, dur:1.2, gain:.16 }); },
      encounter() { noise({ dur:.6, gain:.055, type:'bandpass', freq:300, to:900, q:1.2 }); tone(120, { to:170, dur:.5, gain:.06 }); },
      start() { noise({ dur:.5, gain:.045, type:'bandpass', freq:400, to:1400 }); [659, 880].forEach((f, i) => tone(f, { type:'triangle', dur:.24, gain:.06, delay:.1 + i * .1 })); }
    };

    function play(name) {
      if (!enabled || document.hidden) return;
      const c = ensure(); if (!c) return;
      if (c.state === 'suspended') c.resume().catch(() => {});
      const gap = GAP[name] || 30, now = performance.now();
      if (lastAt[name] && now - lastAt[name] < gap) return;
      lastAt[name] = now;
      const voice = VOICES[name]; if (!voice) return;
      try { voice(); } catch { /* 浏览器拒绝过早创建音源时静默跳过 */ }
    }

    // 底色：低通白噪声 + 极慢的起伏，像浪一层层推过来
    function startAmbience() {
      if (!enabled || ambience || !ctx || ctx.state !== 'running') return;
      try {
        const src = ctx.createBufferSource(); src.buffer = noiseBuffer(); src.loop = true;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 460; lp.Q.value = .6;
        const g = ctx.createGain(); g.gain.value = .001;
        const lfo = ctx.createOscillator(), depth = ctx.createGain();
        lfo.frequency.value = .07; depth.gain.value = .018;
        lfo.connect(depth).connect(g.gain);
        src.connect(lp).connect(g).connect(bus);
        src.start(); lfo.start();
        g.gain.exponentialRampToValueAtTime(.05, ctx.currentTime + 3);
        ambience = { src, lfo, g };
      } catch { ambience = null; }
    }
    function stopAmbience() {
      if (!ambience || !ctx) return;
      const { src, lfo, g } = ambience; ambience = null;
      try {
        g.gain.cancelScheduledValues(ctx.currentTime);
        g.gain.setTargetAtTime(.0001, ctx.currentTime, .25);
        src.stop(ctx.currentTime + 1.2); lfo.stop(ctx.currentTime + 1.2);
      } catch { /* 已停止 */ }
    }
    function setEnabled(on) {
      enabled = !!on;
      if (!enabled) {
        if (ctx && bus) { bus.gain.cancelScheduledValues(ctx.currentTime); bus.gain.setTargetAtTime(0, ctx.currentTime, .06); }
        stopAmbience();
        return;
      }
      const c = ensure(); if (!c) return;
      if (c.state === 'suspended') c.resume().catch(() => {});
      if (bus) { bus.gain.cancelScheduledValues(c.currentTime); bus.gain.setTargetAtTime(.85, c.currentTime, .06); }
      startAmbience();
    }
    function unlock() {
      if (!enabled) return;
      const c = ensure(); if (!c) return;
      if (c.state === 'suspended') c.resume().then(startAmbience).catch(() => {});
      else startAmbience();
    }
    function suspend(on) {
      if (!ctx) return;
      if (on && ctx.state === 'running') ctx.suspend().catch(() => {});
      else if (!on && enabled && ctx.state === 'suspended') ctx.resume().catch(() => {});
    }
    return { play, setEnabled, unlock, suspend };
  })();

  // 旧调用点保留同名入口：拆除＝下行，放置＝木质闷响
  function sound(remove) { SFX.play(remove ? 'remove' : 'place'); }
  function editCell(x,y,remove=false) {
    if (run && run.phase !== "build") return;
    if (moving && !remove) { pickOrDrop(x,y); return; }
    preview = null;
    const k = key(x,y), previous = cells.get(k);
    if (!remove && previous === selected) return;
    if (!remove && !selected) return;   // 点击已有建筑只是查看，不会误拆
    if (remove && !previous) return;
    const before = compute().total;
    const useStock = !remove && selected && (stock[selected] || 0) > 0;
    const cost = run && (remove || selected)
      ? (remove || useStock ? 0 : COST[selected]) - (previous ? COST[previous] : 0)
      : 0;
    if (run && cost > run.wood) { announce('木材不足：需要 '+cost+'，现有 '+run.wood+'。拆除会全额返还。'); SFX.play('error'); return; }
    pushUndo(remove ? '拆除 '+MAP[previous].name : (previous ? '替换为 '+MAP[selected].name : '放置 '+MAP[selected].name));
    if (run) run.wood -= cost;
    if (useStock) stock[selected]--;
    if (remove) { cells.delete(k); noGhostKey = k; }
    else { cells.set(k,selected); drawer(false); }
    paint();
    preview = null;
    const after = compute().total;
    if (previous === cells.get(k)) return;
    sound(remove);
    spark(x,y,remove,previous);
    floatDeltas(before, after);
    landCell(k);
    announce(remove ? '已拆除建筑' : '已放置'+MAP[selected].name+' · 继续点击可连续建造');
  }

  // ---------------- 撤销 ----------------
  function pushUndo(label) {
    if (run && run.phase !== 'build') return;   // 战斗/结算期间的操作不进入撤销栈
    undoStack.push({
      label,
      cells: [...cells],
      wood: run ? run.wood : 0,
      hp: run ? run.hp : 100,
      stock: { ...stock },
      sizeIdx
    });
    if (undoStack.length > UNDO_MAX) undoStack.shift();
    paintUndo();
  }
  function clearUndo() { undoStack = []; paintUndo(); }
  function canUndo() { return undoStack.length > 0 && (!run || run.phase === 'build'); }
  function paintUndo() {
    const btn = $('#undoBtn');
    if (!btn) return;
    btn.disabled = !canUndo();
    btn.title = canUndo() ? '撤销：' + undoStack.at(-1).label + '（Ctrl+Z）' : '没有可撤销的整备操作';
  }
  function undoLast() {
    if (!canUndo()) {
      announce(run && run.phase !== 'build' ? '战斗结算后不能撤销，以免倒退已领取的奖励。' : '没有可撤销的整备操作。');
      SFX.play('error');
      return;
    }
    const snap = undoStack.pop();
    held = null;
    setMoving(false); setRemoving(false);
    selected = null; hover = null; preview = null; noGhostKey = null;
    cells.clear();
    for (const [k, id] of snap.cells) cells.set(k, id);
    stock = { ...snap.stock };
    if (run) { run.wood = snap.wood; run.hp = snap.hp; }
    if (snap.sizeIdx !== sizeIdx) {
      sizeIdx = snap.sizeIdx; N = SIZES[sizeIdx].n;
      $('#growBtn').disabled = sizeIdx === SIZES.length - 1;
      $('#growBtn').textContent = sizeIdx === SIZES.length - 1 ? '已达 5×5' : '扩建';
      buildGrid();
    }
    paint(); paintUndo();
    SFX.play('undo');
    announce('已撤销：' + snap.label);
  }

  function floatDeltas(before, after) {
    for (const [target, value] of after) {
      const delta = value - before.get(target);
      if (!delta) continue;
      const [tx,ty] = target.split(',').map(Number), p = point(tx,ty);
      const text = document.createElement('span'); text.className='float';
      text.textContent = (delta>0?'+':'') + Number(delta.toFixed(2));
      text.style.left=(p.x+unit/2)+'px'; text.style.top=(p.y-15)+'px';
      gridEl.append(text); setTimeout(()=>text.remove(),900);
    }
  }
  function spark(x,y,remove,previous) {
    if (reducedMotion.matches) return;
    const p = point(x,y);
    for(let i=0;i<10;i++) {
      const particle=document.createElement('i'); particle.className='particle'+(i%2?' water':'');
      particle.style.left=(p.x+unit/2)+'px';particle.style.top=(p.y+unit*.32)+'px';
      particle.style.setProperty('--dx',((i-4.5)*10)+'px');
      particle.style.setProperty('--dy',(-18-Math.sin(i)*20)+'px');
      gridEl.append(particle);setTimeout(()=>particle.remove(),550);
    }
    if(remove && previous) {
      const ghost=document.createElement('span');ghost.className='removed';ghost.innerHTML=model(previous);
      ghost.style.cssText='left:'+(p.x+unit*.1)+'px;top:'+(p.y-unit*.41)+'px;width:'+unit*.8+'px;height:'+unit*.9+'px';
      gridEl.append(ghost);setTimeout(()=>ghost.remove(),250);
    }
  }
  function splash(k) {
    if (reducedMotion.matches) return;
    const [x,y] = k.split(',').map(Number), p = point(x,y);
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('i');
      dot.className = 'particle water';
      dot.style.left=(p.x+unit/2)+'px'; dot.style.top=(p.y+unit*.32)+'px';
      dot.style.setProperty('--dx',((i-1)*9)+'px');
      dot.style.setProperty('--dy',(-14-i*6)+'px');
      gridEl.append(dot); setTimeout(()=>dot.remove(),550);
    }
  }
  function landCell(k) {
    if (reducedMotion.matches) return;
    const el = cellEls.get(k);
    if (!el) return;
    el.querySelector('.ic').animate([{transform:'translateY(-35px)',opacity:.3},{transform:'translateY(4px)',offset:.75},{transform:'translateY(0)',opacity:1}],{duration:220,easing:'ease-out'});
    gridEl.animate([{translate:'0 0'},{translate:'0 3px'},{translate:'0 0'}],{duration:220});
  }

  // ---------------- 移动 / 交换 ----------------
  function setMoving(value) {
    moving = value;
    if (!value) held = null;
    document.body.classList.toggle('moving', value);
    const btn = $('#moveBtn');
    if (btn) btn.setAttribute('aria-pressed', String(value));
    if (value) { selected = null; setRemoving(false); }
  }
  function pickOrDrop(x,y) {
    const k = key(x,y), id = cells.get(k);
    if (!held) {
      if (!id) { announce('先点一艘建筑，再点要放的位置。'); return; }
      held = { x, y };
      paint();
      announce('已拿起 '+MAP[id].name+' · 点空格移动，点另一座建筑交换，Esc 放回');
      return;
    }
    if (held.x === x && held.y === y) {
      held = null; paint();
      announce('已放回原处。');
      return;
    }
    moveBuilding(held, { x, y });
  }
  function moveBuilding(from, to) {
    held = null;
    if (run && run.phase !== 'build') { paint(); return; }
    const fromKey = key(from.x, from.y), toKey = key(to.x, to.y);
    const id = cells.get(fromKey);
    if (!id || fromKey === toKey) { paint(); return; }
    const other = cells.get(toKey) || null;
    const before = compute().total;
    pushUndo(other ? '交换 '+MAP[id].name+' 与 '+MAP[other].name : '移动 '+MAP[id].name);
    cells.delete(fromKey);
    cells.set(toKey, id);
    if (other) cells.set(fromKey, other);
    paint();
    const after = compute().total;
    SFX.play('swap');
    floatDeltas(before, after);
    landCell(toKey);
    announce(other
      ? MAP[id].name+' 与 '+MAP[other].name+' 交换了位置 · 木材不变'
      : '已把 '+MAP[id].name+' 移到 '+(to.y*N+to.x+1)+' 号格 · 木材不变');
  }

  // ---------------- 拖拽 ----------------
  let drag = null;
  function startDrag(ev, x, y) {
    if (run && run.phase !== 'build') return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    if (removing || moving || selected) return;   // 建造/拆除模式下拖拽会与落点操作冲突
    const id = cells.get(key(x, y));
    if (!id) return;
    drag = { from: { x, y }, id, x0: ev.clientX, y0: ev.clientY, moved: false, ghost: null, over: null };
  }
  function cellFromPoint(cx, cy) {
    const el = document.elementFromPoint(cx, cy);
    const cell = el && el.closest ? el.closest('.cell') : null;
    return cell && gridEl.contains(cell) ? cell : null;
  }
  function dragMove(ev) {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0) < 8) return;
      drag.moved = true;
      document.body.classList.add('dragging');
      const ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.style.width = Math.max(44, unit * .8) + 'px';
      ghost.innerHTML = model(drag.id);
      document.body.append(ghost);
      drag.ghost = ghost;
      held = { x: drag.from.x, y: drag.from.y };
      paint();
    }
    ev.preventDefault();
    drag.ghost.style.left = ev.clientX + 'px';
    drag.ghost.style.top = ev.clientY + 'px';
    const cell = cellFromPoint(ev.clientX, ev.clientY);
    if (drag.over && drag.over !== cell) drag.over.classList.remove('drop');
    drag.over = cell;
    if (cell) cell.classList.add('drop');
  }
  function dragEnd(ev) {
    if (!drag) return;
    const d = drag; drag = null;
    document.body.classList.remove('dragging');
    if (d.ghost) d.ghost.remove();
    cellEls.forEach(el => el.classList.remove('held', 'drop'));
    if (!d.moved) return;                     // 单击不放：沿用原有检视行为
    let target = cellFromPoint(ev.clientX, ev.clientY);
    if (target && target.dataset.cx === undefined) target = null;
    if (!target) { held = null; paint(); announce('拖到甲板上的格子才能放下。'); return; }
    const x = Number(target.dataset.cx), y = Number(target.dataset.cy);
    if (x === d.from.x && y === d.from.y) { held = null; paint(); return; }
    moveBuilding(d.from, { x, y });
  }

  // ---------------- 建格盘 ----------------
  function hullDetails() {
    const w=N*unit,h=w*.64;
    let art='<path d="M0 '+h/2+'L'+w/2+' '+h+' '+w+' '+h/2+'V'+(h/2+19)+'L'+w/2+' '+(h+19)+' 0 '+(h/2+19)+'Z" fill="#594631"/>';
    for(let side=0;side<2;side++)for(let i=0;i<N;i++) {
      const t=(i+.5)/N,x=side?w/2+t*w/2:t*w/2,y=side?h-t*h/2:h/2+t*h/2;
      const r=unit*.26;
      art+='<g transform="translate('+x+' '+(y+10)+') rotate('+(side?-32:32)+')"><rect x="'+(-r)+'" y="-7" width="'+r*2+'" height="23" rx="7" fill="url(#oak)" stroke="#533e2b"/><ellipse cx="'+r+'" cy="4" rx="5" ry="11" fill="#8d6d46" stroke="#c39b60"/><path d="M'+(-r*.5)+' -7v23m'+r+'-23v23" stroke="#4b5c58" stroke-width="4"/><path d="M'+(-r+5)+' -3h'+(r*2-8)+'" stroke="#d6b980" opacity=".6"/></g>';
    }
    art+='<path d="M4 '+(h/2+1)+'L'+w/2+' '+(h+1)+' '+(w-4)+' '+(h/2+1)+'" stroke="#dfc18a" stroke-width="3" fill="none"/><path d="M4 '+(h/2+1)+'L'+w/2+' '+(h+1)+' '+(w-4)+' '+(h/2+1)+'" stroke="#7f603e" stroke-width="1" stroke-dasharray="2 3" fill="none"/>';
    return '<svg class="hull-detail" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+art+'</svg>';
  }
  function buildGrid() {
    gridEl.innerHTML = '';
    cellEls.clear();
    gridEl.style.setProperty('--n', N);
    const byWidth = (innerWidth - 40) / N;
    const byHeight = (innerHeight - 250) / (N * .64 + .55);
    unit = Math.max(64, Math.min(144 - sizeIdx * 24, byWidth, byHeight));
    gridEl.style.setProperty('--cell', unit + 'px');
    gridEl.classList.toggle('compact-labels', unit < 90);
    gridEl.style.setProperty('--label-size', Math.max(16, Math.min(25, unit * .2)) + 'px');
    gridEl.style.setProperty('--label-small', Math.max(8, Math.min(10, unit * .075)) + 'px');
    $('.raft').style.animationDuration = (7.1+sizeIdx*.4)+'s';
    gridEl.style.width = N * unit + 'px';
    gridEl.style.height = N * unit * .64 + 'px';
    gridEl.innerHTML = hullDetails()+'<svg class="links" aria-hidden="true"></svg><div class="labels" aria-hidden="true"></div>';

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const el = document.createElement('button');
        el.className = 'cell empty';
        el.type = 'button';
        el.dataset.cx = String(x); el.dataset.cy = String(y);
        const p = point(x,y);
        el.style.left = p.x+'px'; el.style.top = p.y+'px';
        el.style.zIndex = x+y+1;
        el.style.setProperty('--wood-tone', String(.92+((x*3+y*7)%5)*.035));
        el.style.setProperty('--delay', -(x*1.3+y*.7)+'s');
        el.innerHTML =
          '<span class="idx">' + (y * N + x + 1) + '</span>' +
          '<span class="ic"></span>' +
          '<span class="nm">空</span>' +
          '<span class="val"></span>' +
          '<span class="mod"></span>';

        el.addEventListener('mouseenter', () => { hover = { x, y }; noGhostKey = null; paint(); });
        el.addEventListener('mouseleave', () => {
          noGhostKey = null;
          if (hover && hover.x === x && hover.y === y) { hover = null; paint(); }
        });
        el.addEventListener('pointerdown', ev => startDrag(ev, x, y));
        el.addEventListener('focus', () => { hover={x,y}; paint(); });
        el.addEventListener('blur', () => { hover=null; paint(); });
        el.addEventListener('click', () => editCell(x,y,removing));
        el.addEventListener('contextmenu', ev => { ev.preventDefault(); editCell(x,y,true); });
        el.addEventListener('keydown', ev => {
          if (ev.key==='Delete' || ev.key==='Backspace') { ev.preventDefault(); editCell(x,y,true); }
        });

        gridEl.appendChild(el);
        cellEls.set(key(x, y), el);
      }
    }
  }

  // ---------------- 重绘 ----------------
  function paint() {
    preview = null;
    if (selected && hover && !cells.has(key(hover.x, hover.y)) && noGhostKey !== key(hover.x, hover.y)) {
      preview = { x: hover.x, y: hover.y, id: selected };
    }

    const res = compute();

    let targetSet = new Set(), sourceSet = new Set();
    if (hover && buildingAt(hover.x, hover.y)) {
      effectTargets(hover.x, hover.y).forEach(k => targetSet.add(k));
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          if (x === hover.x && y === hover.y) continue;
          if (effectTargets(x, y).includes(key(hover.x, hover.y))) sourceSet.add(key(x, y));
        }
      }
    }

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const k = key(x, y);
        const el = cellEls.get(k);
        const b = buildingAt(x, y);
        const isFocus = hover && hover.x === x && hover.y === y;

        el.classList.toggle('empty', !b);
        el.classList.toggle('focus', !!isFocus);
        el.classList.toggle('link', !isFocus && (targetSet.has(k) || sourceSet.has(k)));
        el.classList.toggle('ghost', !!(preview && preview.x === x && preview.y === y));
        el.classList.toggle('held', !!(held && held.x === x && held.y === y));

        if (!b) {
          el.style.setProperty('--c', 'transparent');
          el.querySelector('.ic').innerHTML = '';
          delete el.dataset.building;
          el.querySelector('.nm').textContent = '';
          el.setAttribute('aria-label', (y*N+x+1)+'号空甲板');
          continue;
        }

        el.style.setProperty('--c', CAT[b.cat].color);
        if (el.dataset.building !== b.id || !el.querySelector('.ic svg')) el.querySelector('.ic').innerHTML = model(b.id);
        el.dataset.building = b.id;
        el.setAttribute('aria-label', (y*N+x+1)+'号甲板 '+b.name+'，数值 '+Number(res.total.get(k).toFixed(2)));
        el.querySelector('.nm').textContent = b.name;

        const v = res.total.get(k);
        const valEl = el.querySelector('.val');

        // 纯辅助型（基础值为 0）不显示数值，直接显示效果强度，信息量更高
        const isSupport = (b.base === 0 && effectsOf(b).length > 0) || !!b.rule;
        valEl.classList.toggle('eff', isSupport);
        valEl.classList.toggle('rule-badge', !!b.rule);

        if (isSupport) {
          valEl.textContent = b.rule ? (RULE_BADGE[b.rule] || '规则') : effectBadge(b);
          valEl.style.color = '';
        } else {
          valEl.textContent = v > 0 ? Math.round(v) : '—';
          const diff = v - b.base;
          if (diff > 0.01) valEl.style.color = 'var(--gold)';
          else if (diff < -0.01) valEl.style.color = '#e2705f';
          else valEl.style.color = '#eef7fb';
        }

        const mods = [];
        const f = res.flat.get(k), m = res.mult.get(k);
        if (f !== 0) mods.push('+' + Math.round(f));
        if (m !== 1) mods.push('×' + String(Number(m.toFixed(3))));
        el.querySelector('.mod').textContent = mods.join(' ');
      }
    }

    const labels = gridEl.querySelector('.labels'); labels.innerHTML='';
    // 各建筑高度不同，标签按体型抬升，避免压在塔尖上
    const LABEL_H={beacon:.60,ammo:.47,ballista:.39,harpoon:.35,net:.37,purifier:.36,coral:.36,shield:.36};
    for (const [k, el] of cellEls) {
      if (el.classList.contains('empty')) continue;
      const [x,y]=k.split(',').map(Number), p=point(x,y), bld=buildingAt(x,y);
      if(bld.rule) continue;   // 规则建筑的徽标贴在格子内，不占用浮动标签层
      const label=document.createElement('span'); label.className='value';
      label.style.left=(p.x+unit/2)+'px';
      label.style.top=(p.y-unit*(unit < 90 ? .5 : LABEL_H[bld.id]||.34))+'px';
      label.style.color=el.querySelector('.val').style.color;
      label.innerHTML='<small>'+bld.name+'</small>'+el.querySelector('.val').textContent;
      labels.append(label);
    }
    const lines=gridEl.querySelector('.links'); lines.innerHTML='';
    if (hover) for (const k of new Set([...targetSet,...sourceSet])) {
      const [x,y]=k.split(',').map(Number), p=point(x,y), h=point(hover.x,hover.y);
      lines.innerHTML+='<line x1="'+(h.x+unit/2)+'" y1="'+(h.y+unit*.32)+'" x2="'+(p.x+unit/2)+'" y2="'+(p.y+unit*.32)+'"/>';
    }
    paintStats(res);
    paintFormula(res);
    paintTools();
    paintJourney();
  }

  function paintStats(res) {
    let atk = 0, rsc = 0, sup = 0, used = 0;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const b = buildingAt(x, y);
        if (!b) continue;
        used++;
        // 用逐格取整后的数求和，保证总和等于玩家看到的数字
        const v = Math.round(res.total.get(key(x, y)));
        if (b.cat === 'attack') atk += v;
        else if (b.cat === 'resource') rsc += v;
        else sup += v;
      }
    }
    const stat = (cat) => statsEl.querySelector('[data-cat="' + cat + '"] b');
    // 遗物是整船加成，不属于任何格子，但要算进玩家看到的总数
    const bonus = run ? relicBonus() : {atk:0, inc:0};
    stat('attack').textContent = atk + bonus.atk;
    stat('resource').textContent = rsc + bonus.inc;
    stat('support').textContent = sup;
    stat('space').textContent = used + '/' + (N * N);
  }

  function paintFormula(res) {
    const tooltip = $('.status'); tooltip.hidden = !hover;
    if (hover) {
      const box=cellEls.get(key(hover.x,hover.y)).getBoundingClientRect();
      tooltip.style.left=Math.max(8,Math.min(innerWidth-268,box.right+12))+'px';
      tooltip.style.top=Math.max(8,Math.min(innerHeight-200,box.top-80))+'px';
    }
    if (!hover) {
      formulaEl.innerHTML = '从底部选择建筑，点击甲板放置：相邻／范围的加成立刻反映在数字上。';
      return;
    }

    const b = buildingAt(hover.x, hover.y);
    if (!b) {
      formulaEl.innerHTML = '<span class="k">' + (hover.y * N + hover.x + 1) + ' 号格</span> · 空格　' +
        '<span class="desc">从底部选择建筑，点击甲板放置：相邻／范围的加成立刻反映在数字上。</span>';
      return;
    }

    const k = key(hover.x, hover.y);
    const f = res.flat.get(k), m = res.mult.get(k), v = res.total.get(k);
    const isPreview = preview && preview.x === hover.x && preview.y === hover.y;

    let calc;
    if (b.rule) {
      // 规则型建筑没有数值可算，直接标出规则缩写，避免出现"（基础 0）= 0"这种废话
      calc = '<span class="eq">·</span><span class="res">' + (RULE_BADGE[b.rule] || '规则') + '</span>';
    } else {
      calc = '（基础 ' + b.base;
      if (f !== 0) calc += ' <span class="op">+' + Math.round(f) + '</span>';
      calc += '）';
      if (m !== 1) calc += ' <span class="op">×' + String(Number(m.toFixed(3))) + '</span>';
      calc += '<span class="eq">=</span><span class="res">' + Math.round(v) + '</span>';
    }

    const who = contributors(hover.x, hover.y);
    formulaEl.innerHTML =
      (isPreview ? '<span class="op">【预览】</span>' : '') +
      '<span class="k">' + (hover.y * N + hover.x + 1) + ' 号格 · ' + b.name + '</span>　' + calc +
      '<span class="desc">' + b.desc + '</span>' +
      (who.length ? '<span class="who">受到：' + who.join('，') + '</span>' : '');
  }

  function paintTools() {
    document.querySelectorAll('.tool').forEach(el => {
      const id = el.dataset.id, b = MAP[id];
      el.setAttribute('aria-pressed', el.dataset.id === selected ? 'true' : 'false');
      const locked = !!run && b.unlock && meta.level < b.unlock;
      el.classList.toggle('locked', locked);
      el.querySelector('.cost').textContent =
        locked ? 'Lv ' + b.unlock + ' 解锁'
               : (stock[id] ? '库存 ' + stock[id] : (run ? COST[id] + ' 木' : '免费'));
    });
  }

  // ---------------- 工具箱 ----------------
  function buildTools() {
    const wrap = $('#tools');
    wrap.innerHTML = '';
    ['attack', 'resource', 'skill', 'special'].forEach(cat => {
      const list = BUILDINGS.filter(b => b.cat === cat).sort((a, b) => b.base - a.base);
      if (!list.length) return;
      const head = document.createElement('div');
      head.className = 'cat-h';
      head.style.setProperty('--c', CAT[cat].color);
      head.innerHTML = '<span class="cd"></span>' + CAT[cat].name + '<span class="n">' + list.length + ' 种</span>';
      wrap.appendChild(head);
      const grid = document.createElement('div');
      grid.className = 'tools';
      list.forEach(b => {
        const el = document.createElement('button');
        el.className = 'tool';
        el.type = 'button';
        el.dataset.id = b.id;
        el.style.setProperty('--c', CAT[b.cat].color);
        el.title = b.desc;
        el.innerHTML =
          '<span class="ic"><svg viewBox="0 0 24 24"><use href="#' + ICON[b.id] + '"/></svg></span>' +
          '<span class="tx"><span class="nm"><b>' + b.name + '</b><em class="cost"></em></span>' +
          '<span class="sub">' + (b.base > 0 ? '基础 ' + b.base : (effectsOf(b).length ? effectBadge(b) : CAT[b.cat].name)) + '</span></span>';
        el.addEventListener('click', () => {
          setRemoving(false);
          if (run && b.unlock && meta.level < b.unlock) {
            announce('「' + b.name + '」需要等级 Lv ' + b.unlock + '，继续出航升级来解锁。');
            return;
          }
          selected = (selected === b.id) ? null : b.id;
          paint();
          drawer(false);

  function fleet() {
    preview=null;
    const result=compute(); const totals={attack:0,income:0,shield:0};
    const rules={};   // 规则型建筑：整局判定一次，交给 simulate 生效，而不是逐格数值加成
    for(const [k,id] of cells) {
      const value=Math.round(result.total.get(k));
      if(MAP[id].cat==='attack') totals.attack+=value;
      if(MAP[id].cat==='resource') totals.income+=value;
      if(id==='shield') totals.shield+=value;

    totals.attack+=bonus.atk; totals.income+=bonus.inc;

  // ---------------- 海怪 ----------------
  // pierce: 护盾对其攻击的吸收比例。.6 = 常规，.3 = 大部分穿透，0 = 完全无视护盾
  // hpW/hitW: 在同场多只时的血量/攻击权重（总和会被归一化到当日难度）
  const MONSTERS = {
    tentacle: { name:'浅海触手怪', hpW:1,    hitW:1,    pierce:.6,  tag:'缠网 · 每 3 轮齐射 −25%',      skills:[{k:'stun', every:3, pct:.25}] },
    school:   { name:'银鳞鱼群',   hpW:.5,   hitW:1,    pierce:.3,  tag:'群袭 · 每轮两次半伤，护盾只挡 30%', intent:'swarm', skills:[] },
    shell:    { name:'铁壳蟹',     hpW:1.7,  hitW:.7,   pierce:.6,  tag:'结壳 · 每 3 轮护甲翻倍',       armor:6, intent:'guard', skills:[] },

    spore:    { name:'爆浆孢子',   hpW:.75,  hitW:1,    pierce:.6,  tag:'爆浆 · 死亡时追加 80% 伤害',   skills:[{k:'burst', mult:.8}] },
    wraith:   { name:'深潮幽灵',   hpW:.85,  hitW:1,    pierce:0,   tag:'穿影 · 完全无视护盾',          skills:[] },
    barnacle: { name:'再生藤壶',   hpW:1.1,  hitW:.85,  pierce:.6,  tag:'自愈 · 每轮回 5% 血',          skills:[{k:'regen', pct:.05}] },
    ambush:   { name:'残骸潜伏者', hpW:1.15, hitW:1.25, pierce:.6,  tag:'伏击 · 蓄力一轮，下轮重击 ×3', intent:'charge', chargeMult:3, skills:[] },
    leviathan:{ name:'深海巨兽',   hpW:1,    hitW:1,    pierce:.45, tag:'涡流 1.6× + 每轮回 3% 血',    skills:[{k:'heavy', every:3, mult:1.6},{k:'regen', pct:.03}] }

  // 意图：每只怪每轮只做一件事。三种可区分的行为——蓄力/重击、结壳、群袭——都在 log 里预告。
  const INTENT_LABEL={volley:'齐射',charge:'蓄力',heavy:'重击',guard:'结壳',swarm:'群袭'};
  function intentOf(m, round) {
    if(m.intent==='charge') return round%2===1?{kind:'charge'}:{kind:'heavy',mult:m.chargeMult||3};
    if(m.intent==='guard') return round%3===0?{kind:'guard'}:{kind:'volley'};
    if(m.intent==='swarm') return {kind:'swarm'};
    for(const s of m.skills) if(s.k==='heavy'&&round%s.every===0) return {kind:'heavy',mult:s.mult};
    return {kind:'volley'};
  }
  const ENCOUNTERS = {
    1:{ safe:['tentacle'],           risk:['tentacle','school'] },
    2:{ safe:['school','leech'],     risk:['shell','tentacle'] },
    3:{ safe:['barnacle'],           risk:['spore','school'] },

    5:{ safe:['leviathan'],          risk:['leviathan'] }
  };
  function encounter(day, elite) {
    const row=ENCOUNTERS[day]||ENCOUNTERS[1];

  // ---------------- 战利品 ----------------

  // 建筑给的是"摆在哪"，遗物给的是"这艘船整体强一点"。
  const RELICS = {
    ram:  { name:'破浪撞角',   desc:'全船攻击 +6',            atk:6 },
    bait: { name:'诱饵木桶',   desc:'捕鱼收益 +5',            inc:5 },

    hook: { name:'打捞钩爪',   desc:'每场胜利额外 +8 木材',   loot:8 },

  // ---------------- 进度：章节 / 等级 / 武器解锁 ----------------
  const META_KEY='crazy-fishery.meta.v1';
  const CHAPTERS=[
    { n:1, name:'浅海', boss:'深海巨兽', mult:1.00 },
    { n:2, name:'暗礁', boss:'礁窟之主', mult:1.22 },

  try { const d=JSON.parse(localStorage.getItem(META_KEY)||'null'); if(d&&typeof d.level==='number') meta=Object.assign(meta,d); } catch {}
  function saveMeta(){ try{localStorage.setItem(META_KEY,JSON.stringify(meta));}catch{} }
  function currentChapter(){ return CHAPTERS[Math.min(meta.chapter,CHAPTERS.length)-1]||CHAPTERS[0]; }
  function xpToNext(level){ return 40+(level-1)*30; }
  // 解锁：自由构筑（无 run）不设限；冒险里按等级锁进阶武器
  function unlocked(id){ const b=MAP[id]; return !b||!b.unlock||!run||meta.level>=b.unlock; }
  function addXp(n){
    if(meta.level>=99)return false;
    meta.xp+=n; let up=false;
    while(meta.xp>=xpToNext(meta.level)&&meta.level<99){ meta.xp-=xpToNext(meta.level); meta.level++; up=true; }
    saveMeta(); return up;
  }
  function nextUnlock(){
    return BUILDINGS.find(b=>b.unlock&&b.unlock>meta.level&&b.unlock<=meta.level+1) ||
           BUILDINGS.filter(b=>b.unlock&&b.unlock>meta.level).sort((a,b)=>a.unlock-b.unlock)[0] || null;

  function relicBonus() {
    const sum={atk:0,inc:0,foeHp:0,loot:0,heal:0};
    for(const id of (run&&run.relics)||[]) {
      const r=RELICS[id]; if(!r) continue;
      sum.atk+=r.atk||0; sum.inc+=r.inc||0; sum.foeHp+=r.foeHp||0;
      sum.loot+=r.loot||0; sum.heal+=r.heal||0;
    }
    sum.foeHp=Math.max(-.5,sum.foeHp);

  }
  function shuffle(list) {
    const a=list.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

  function rewardOptions() {
    const owned=new Set(run.relics||[]);
    const relicIds=shuffle(Object.keys(RELICS).filter(id=>!owned.has(id)));
    const buildIds=shuffle(BUILDINGS.filter(b=>unlocked(b.id)).map(b=>b.id));
    const mats=shuffle(['wood:'+(20+run.day*10),'wood:'+(36+run.day*14),'repair:'+(20+run.day*5)]);
    const out=[];
    if(relicIds.length) out.push('relic:'+relicIds[0]);
    if(buildIds.length) out.push('build:'+buildIds[0]);
    for(const m of mats) {
      if(out.length>=3) break;
      if(m.startsWith('wood')&&out.some(id=>id.startsWith('wood'))) continue;
      out.push(m);
    }
    while(out.length<3) out.push('wood:'+(20+run.day*10));
    return out.slice(0,3);
  }

  // 唯一的战斗结算源：预测、逐轮动画、最终结果都读同一份 log。
  // 每轮双方同时出手：本轮开打时活着的海怪即使被打死，也照常攻击。
  const MAX_ROUNDS=40;
  function simulate(ship, foes, ctx) {
    // 多只海怪会分散血量、先死的少打几轮，所以要按数量补一点总强度
    const power=Math.round(ctx.power*(1+.18*Math.max(0,foes.length-1)));
    const pool=Math.round(power*(ctx.boss?3:2)*(ship.foeHp||1));
    const totalHit=Math.ceil(power/4);
    const hpSum=foes.reduce((s,id)=>s+MONSTERS[id].hpW,0);
    const hitSum=foes.reduce((s,id)=>s+MONSTERS[id].hitW,0);
    const monsters=[];
    let hpCum=0, hpGiven=0, hitCum=0, hitGiven=0;
    foes.forEach((id,i)=>{
      const m=MONSTERS[id];
      hpCum+=pool*m.hpW/hpSum; hitCum+=totalHit*m.hitW/hitSum;
      // 逐只取整后用差值补齐，保证总和精确等于当日难度，不会因为四舍五入变强
      const maxHp=Math.max(1,Math.round(hpCum)-hpGiven);
      const hit=Math.max(1,Math.round(hitCum)-hitGiven);
      hpGiven+=maxHp; hitGiven+=hit;
      monsters.push({key:i, id, name:m.name, maxHp, hp:maxHp, hit,
        armor:m.armor||0, pierce:m.pierce==null?.6:m.pierce,
        intent:m.intent||null, chargeMult:m.chargeMult||3,
        skills:(m.skills||[]).map(s=>({...s})), alive:true});
    });
    let rounds=0, damage=0, wood=0;
    const log=[];
    // 规则型建筑在这里生效：护盾默认每轮重置，「潮汐闸」让它结转，上限 2 倍单轮护盾。
    // 预测、逐轮动画、最终扣血都读这一份 log，规则只写一次就不会出现三处对不上。
    const rules=ship.rules||{};
    const shieldCarry=!!rules.shieldCarry && (ship.shield||0)>0;
    const shieldCap=(ship.shield||0)*2;
    let shieldPool=0;
    while(monsters.some(m=>m.alive) && ship.attack>0 && rounds<MAX_ROUNDS) {
      rounds++;
      const ev={round:rounds, tags:[], dealt:0, raw:0, absorb:0, taken:0, heal:0, kills:[], stolen:0};
      const aliveStart=monsters.filter(m=>m.alive);
      // 本轮意图先定下来：齐射 / 蓄力 / 重击 / 结壳 / 群袭。预告与结算读同一份，不会各说各话。
      const plan=new Map();
      for(const m of aliveStart) {
        const p=intentOf(m,rounds);
        plan.set(m,p);
        if(p.kind==='charge') ev.tags.push(m.name+' 蓄力（本轮不出手）');
        else if(p.kind==='guard') ev.tags.push(m.name+' 结壳（护甲翻倍）');
        else if(p.kind==='swarm') ev.tags.push(m.name+' 群袭 ×2');
        else if(p.kind==='heavy') ev.tags.push(m.name+' 重击 ×'+p.mult);
      }
      // 本轮意图也写进 log，开场那一轮还没有"上一轮播报"可读
      ev.intents=aliveStart.map(m=>({id:m.id,name:m.name,kind:plan.get(m).kind}));
      // 玩家齐射
      let volley=ship.attack;
      for(const m of aliveStart) for(const s of m.skills)
        if(s.k==='stun'&&rounds%s.every===0) {
          volley=Math.max(1,Math.round(volley*(1-s.pct)));
          ev.tags.push(m.name+' 缠网：齐射 −'+Math.round(s.pct*100)+'%');
        }
      let remain=volley;
      for(const m of monsters) {
        if(!m.alive||remain<=0) continue;
        const armor=(plan.get(m)&&plan.get(m).kind==='guard')?m.armor*2:m.armor;
        const through=Math.max(1,remain-armor);
        const dealt=Math.min(m.hp,through);
        m.hp-=dealt; ev.dealt+=dealt;
        remain=Math.max(0,remain-dealt-armor);
        if(m.hp<=0){m.alive=false;ev.kills.push(m.name);}
      }
      // 海怪反击：先汇总本轮命中，再统一抵扣护盾。
      // 默认规则：护盾每轮重置，每只怪按自己的穿透系数各吃一份，最多吃完整池。
      // 潮汐闸规则：护盾是一整池——跨轮保留（上限 2 倍），按整池抵扣，但每轮最多挡下 3/4 命中；
      // perice 0（穿影）依然完全无视护盾，否则这只怪的存在意义就没了。
      let raw=0;
      const hits=new Map();
      for(const m of aliveStart) {
        const p=plan.get(m)||{kind:'volley'};
        let parts=[];
        if(p.kind==='charge') parts=[];                                   // 蓄力：本轮不出手
        else if(p.kind==='swarm') parts=[Math.round(m.hit*.5),Math.round(m.hit*.5)];
        else if(p.kind==='heavy') parts=[Math.round(m.hit*(p.mult||2))];
        else parts=[m.hit];
        hits.set(m,parts);
        for(const v of parts) raw+=v;
      }
      let absorbed=0;
      let budget=shieldCarry?Math.min(shieldCap,shieldPool+ship.shield):ship.shield;
      const ceiling=shieldCarry?raw*.75:Infinity;
      for(const m of aliveStart) {
        if(shieldCarry&&m.pierce===0) continue;   // 穿影：整池规则也不挡
        for(const v of hits.get(m)||[]) {
          let take=Math.min(budget,shieldCarry?v:v*m.pierce);
          if(shieldCarry) take=Math.min(take,Math.max(0,ceiling-absorbed));
          absorbed+=take; budget-=take;
        }
      }
      const taken=raw>0?Math.max(1,raw-Math.round(absorbed)):0;
      damage+=taken;
      Object.assign(ev,{raw,absorb:Math.round(absorbed),taken});
      if(shieldCarry) {
        const kept=Math.max(0,budget);
        if(kept>0) ev.tags.push('盾续 +'+Math.round(kept));
        shieldPool=kept;
      }
      // 死亡时报复
      for(const m of aliveStart) if(!m.alive) for(const s of m.skills)
        if(s.k==='burst') {
          const extra=Math.max(1,Math.round(m.hit*s.mult));
          damage+=extra; ev.taken+=extra;
          ev.tags.push(m.name+' 爆浆 +'+extra);
        }
      // 自愈与偷木
      for(const m of monsters) if(m.alive) for(const s of m.skills)
        if(s.k==='regen') {
          const heal=Math.max(1,Math.round(m.maxHp*s.pct));
          m.hp=Math.min(m.maxHp,m.hp+heal); ev.heal+=heal;
        }
      for(const m of aliveStart) for(const s of m.skills)
        if(s.k==='drain'){wood+=s.v;ev.stolen+=s.v;}
      ev.hpLeft=monsters.reduce((s,m)=>s+(m.alive?m.hp:0),0);
      ev.alive=monsters.filter(m=>m.alive).map(m=>m.id);
      ev.front=ev.alive[0]||monsters.find(m=>!m.alive)?.id||null;
      // 下轮预告：让玩家在播报里就能看到"它要蓄力了"
      ev.next=monsters.filter(m=>m.alive).map(m=>({id:m.id,name:m.name,kind:intentOf(m,rounds+1).kind}));
      log.push(ev);
    }
    return {rounds, damage, wood, log, monsters, win:monsters.every(m=>!m.alive)};
  }
  // Both the forecast and settlement call this function. Each round attacks simultaneously.
  function forecast(elite) {
    const f=fleet(), boss=run.day===5;
    const ch=currentChapter();
    const power=Math.round((boss?72:12+run.day*8+(elite?14:0))*ch.mult);
    const foes=encounter(run.day,elite);
    const sim=simulate(f,foes,{power,boss});
    const enemyHp=sim.monsters.reduce((s,m)=>s+m.maxHp,0);
    const hit=sim.monsters.reduce((s,m)=>s+m.hit,0);
    const damage=f.attack?sim.damage:run.hp;
    // 净损 = 打完这一仗船体实际少多少（盐罐的战后回血要算进去，但不能救沉没）
    const heal=f.heal||0;
    const net=damage>=run.hp?run.hp:run.hp-Math.min(100,Math.max(0,run.hp-damage)+heal);
    return {...f,foes,enemies:sim.monsters,enemyHp,hit,
      rounds:f.attack?sim.rounds:Infinity,
      damage,net,heal,reward:Math.max(0,(elite?16:8)+f.income-sim.wood+(f.loot||0)),
      stolen:sim.wood,log:sim.log,boss,bossName:boss?ch.boss:null};
  }

    {id:'3c',day:3,col:2,kind:'supply',links:['4b']},
    {id:'4a',day:4,col:1,kind:'fight', links:['5']},
    {id:'4b',day:4,col:2,kind:'elite', links:['5']},
    {id:'4c',day:4,col:0,kind:'event', links:['5'], event:'storm'},
    {id:'5', day:5,col:1,kind:'boss',  links:[]}
  ];
  const NODE_MAP={};
  MAP_NODES.forEach(n=>{NODE_MAP[n.id]=n;});
  const KIND_NAME={fight:'巡游',elite:'险航',supply:'补给',event:'事件',boss:'终局'};
  const nodeX=n=>COLX[n.col];
  const nodeY=n=>24+(5-n.day)*36;
  // 走过的节点 id 序列；当前位置 = 最后一个
  function routeNodes(){ return run&&run.route?run.route.map(r=>r.node):[]; }
  function hereNode(){ const h=routeNodes(); return h.length?NODE_MAP[h[h.length-1]]:null; }
  function reachableNodes(){
    if(!run) return [];
    const here=hereNode();
    if(!here) return MAP_NODES.filter(n=>n.day===1);
    return here.links.map(id=>NODE_MAP[id]).filter(Boolean);
  }
  // 图只回答"我在哪、能往哪走、走过哪条路"；打谁交给下面的船票。
  function seaChart() {
    const hist=routeNodes(), here=hereNode();
    const open=new Set(reachableNodes().map(n=>n.id));
    const hereId=here?here.id:null;
    // 从这里往后还能走到的航点；走不回来的分支只是背景噪声
    const ahead=new Set();
    const stack=Array.from(open);
    while(stack.length) {
      const id=stack.pop();
      if(ahead.has(id))continue;
      ahead.add(id);
      for(const t of NODE_MAP[id].links) stack.push(t);
    }
    let edges='';
    const pushEdge=(fx,fy,n,isOpen,fromId)=>{
      edges+='<line class="edge '+n.kind+(isOpen?' open':(ahead.has(n.id)?' ahead':''))+'" data-to="'+n.id+'" data-from="'+fromId+'" x1="'+fx+'" y1="'+fy+'" x2="'+nodeX(n)+'" y2="'+nodeY(n)+'"/>';
    };
    for(const n of MAP_NODES) for(const to of n.links) pushEdge(nodeX(n),nodeY(n),NODE_MAP[to],hereId===n.id&&open.has(to),n.id);
    for(const n of MAP_NODES) if(n.day===1) pushEdge(START.x,START.y,n,!here,'start');
    let nodes='';
    let lastDay=0;
    for(const n of MAP_NODES) {
      const x=nodeX(n), y=nodeY(n);
      if(n.day!==lastDay){ lastDay=n.day;
        if(n.day<=5) nodes+='<text class="axis'+(n.day===run.day?' now':'')+'" x="40" y="'+(y+3)+'">第 '+n.day+' 天</text>';
      }
      const cls=['node',n.kind];
      const onPath=hist.indexOf(n.id)>=0;
      if(onPath&&n.id===hereId) cls.push('here');
      else if(onPath) cls.push('taken');
      else if(open.has(n.id)) cls.push('open');
      else if(!ahead.has(n.id)) cls.push('dead');
      else if(n.day<run.day) cls.push('passed');
      else cls.push('lock');
      if(n.kind==='supply') nodes+='<rect data-id="'+n.id+'" class="'+cls.join(' ')+'" x="'+(x-6.5)+'" y="'+(y-6.5)+'" width="13" height="13" rx="2.5"/>';
      else if(n.kind==='event') nodes+='<polygon data-id="'+n.id+'" class="'+cls.join(' ')+'" points="'+x+','+(y-7.5)+' '+(x+7.5)+','+y+' '+x+','+(y+7.5)+' '+(x-7.5)+','+y+'"/>';
      else nodes+='<circle data-id="'+n.id+'" class="'+cls.join(' ')+'" cx="'+x+'" cy="'+y+'" r="'+(n.kind==='boss'?11:8)+'"/>';
      if(n.kind==='boss') nodes+='<text class="crown" x="'+x+'" y="'+(y+4)+'">♛</text>';
    }
    const pts=[START.x+','+START.y];
    for(const id of hist) { const n=NODE_MAP[id]; if(n) pts.push(nodeX(n)+','+nodeY(n)); }
    const tail=hist.length?hist[hist.length-1]:null;
    const boatAt=tail?{x:nodeX(NODE_MAP[tail]),y:nodeY(NODE_MAP[tail])}:START;
    const contours='<g class="contour"><ellipse cx="154" cy="112" rx="126" ry="88"/><ellipse cx="154" cy="112" rx="88" ry="60"/><ellipse cx="154" cy="112" rx="52" ry="34"/></g>';
    const boat='<g class="boat" transform="translate('+(boatAt.x+15)+','+boatAt.y+')"><path d="M-1 -11 L6 0 L-6 0 Z" fill="#ffe6b3"/><path d="M-8 3 H8 L4 7 H-4 Z" fill="#e8c88a"/></g>';
    return '<div class="chart" id="chart" role="img" aria-label="五日航线网，当前第 '+run.day+' 天，可前往 '+reachableNodes().length+' 个航点">'+
      '<svg viewBox="0 0 300 214">'+contours+edges+
      '<circle class="start" cx="'+START.x+'" cy="'+START.y+'" r="3.2"/>'+
      '<polyline class="trail" points="'+pts.join(' ')+'"/>'+nodes+boat+
      '<text x="288" y="208" class="north">N ↑</text></svg></div>';
  }
  function supplyArt(){
    return '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="22" width="44" height="30" rx="3" fill="#c9a05c"/><rect x="10" y="22" width="44" height="8" rx="3" fill="#e0bd7c"/><path d="M32 22v30M10 35h44" stroke="#7d5a2a" stroke-width="2.5"/><path d="M18 16l14-8 14 8" fill="none" stroke="#e8d9ac" stroke-width="3" stroke-linecap="round"/></svg>';
  }
  // 船票：一条航道一行——谁在这条道上、会掉多少血、能拿多少木头。
  function sailRow(f, node) {
    const names=f.boss?(f.bossName||'深海巨兽'):f.foes.map(id=>MONSTERS[id].name).join('、');
    const tags=f.foes.map(id=>MONSTERS[id].tag).join(' · ');
    const danger=f.damage>=run.hp;
    return '<button class="sail-row '+node.kind+'" data-node="'+node.id+'" data-day="'+run.day+
      '" aria-label="第 '+run.day+' 天 '+KIND_NAME[node.kind]+'：'+names+'，预计船损 '+f.net+'">'+
      '<span class="art">'+monsterArt(f.foes[0])+'</span>'+
      '<span class="body"><b>'+names+'</b><small>'+tags+'</small></span>'+
      '<span class="num"><b>'+f.net+'</b><small>船损</small></span>'+
      '<span class="num gain"><b>+'+f.reward+'</b><small>木材</small></span>'+
      '<span class="go'+(danger?' wreck':'')+'">'+(danger?'会沉':'出发')+' →</span></button>';
  }
  function supplyRow(node) {
    return '<button class="sail-row supply" data-node="'+node.id+'" data-day="'+run.day+'" aria-label="第 '+run.day+' 天 漂流补给">'+
      '<span class="art">'+supplyArt()+'</span>'+
      '<span class="body"><b>漂流补给</b><small>不打架，停靠就搬东西：木材 / 修船 / 一件库存建筑</small></span>'+
      '<span class="num"><b>—</b><small>船损</small></span>'+
      '<span class="num gain"><b>三选一</b><small>收获</small></span>'+
      '<span class="go">停靠 →</span></button>';
  }
  // 事件：停靠后必须做一次取舍，收益与代价同时结算，没有"白拿"的选项
  const EVENT_ART={
    lamp:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6v7" stroke="#e8d9ac" stroke-width="3"/><rect x="20" y="13" width="24" height="28" rx="5" fill="#f0d79a" stroke="#8a6f3c" stroke-width="2"/><circle cx="32" cy="27" r="7" fill="#fff4c2"/><path d="M16 43h32l-5 9H21Z" fill="#9c8465"/></svg>',
    wave:'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 40q8-9 16 0t16 0 16 0" fill="none" stroke="#b7e9e3" stroke-width="3" stroke-linecap="round"/><path d="M8 50q8-9 16 0t16 0 16 0" fill="none" stroke="#8fd3bf" stroke-width="3" stroke-linecap="round"/><path d="M32 8l11 17H21Z" fill="#e9a878"/></svg>'
  };
  function eventRow(node) {
    const def=EVENTS[node.event]||{title:'未知事件',teaser:''};
    return '<button class="sail-row event" data-node="'+node.id+'" data-day="'+run.day+'" aria-label="第 '+run.day+' 天 事件：'+def.title+'">'+
      '<span class="art">'+(EVENT_ART[node.event]||EVENT_ART.lamp)+'</span>'+
      '<span class="body"><b>'+def.title+'</b><small>'+def.teaser+'</small></span>'+
      '<span class="num"><b>—</b><small>船损</small></span>'+
      '<span class="num gain"><b>二选一</b><small>抉择</small></span>'+
      '<span class="go">停靠 →</span></button>';
  }

  const POOLS = {common:['ballista','harpoon','net','purifier'],rare:['ammo','shield','tidegate','chain','mortar'],legendary:['beacon','coral','doom']};
  const RARITY = {common:'普通',rare:'稀有',legendary:'传奇'};
  function recruit(count) {
    if(run&&run.phase!=='build')return;
    const results=[];
    for(let i=0;i<count;i++) {
      const roll=rnd();
      const rarity=pity>=19||roll>=.95?'legendary':roll>=.70?'rare':'common';
      let pool=(POOLS[rarity]||[]).filter(id=>unlocked(id));
      if(!pool.length) pool=POOLS.common.filter(id=>unlocked(id));
      const id=pool[Math.floor(rnd()*pool.length)];
      pity=rarity==='legendary'?0:pity+1;
      stock[id]=(stock[id]||0)+1;results.push({id,rarity});
    }
    openShop(results);
  }
  function openShop(results=[]) {
    if(run&&run.phase!=='build')return;
    const cards=results.map((r,i)=>'<div class="recruit-card '+r.rarity+'" style="--delay:'+i*.025+'s">'+model(r.id)+'<small>'+RARITY[r.rarity]+'</small><b>'+MAP[r.id].name+'</b></div>').join('');
    const inventory=Object.entries(stock).filter(([,n])=>n>0).map(([id,n])=>'<span>'+MAP[id].name+' ×'+n+'</span>').join('')||'<span>还没有库存，试试抽一次。</span>';
    showJourney(results.length?'打捞完成 · '+results.length+' 件建筑':'漂流商会 · 招募与物资',
      '<div class="shop-banner">金币 ∞ · 测试模式 · 无真实支付</div>'+
      '<p>单抽 100 金币 / 十连 1,000 金币。测试金币无限，可反复购买。</p>'+
      '<small>普通 70% · 稀有 25% · 传奇 5%。连续 19 次未出传奇，第 20 次必出；出传奇后重新计数。距保底最多 '+(20-pity)+' 抽。</small>'+
      (cards?'<div class="recruit-grid">'+cards+'</div>':'')+
      '<p><b>仓库</b> · 建造时优先消耗库存，无需木材。</p><div class="stock">'+inventory+'</div>'+
      '<div class="shop-items">'+BUILDINGS.filter(b=>unlocked(b.id)).map(b=>'<button data-buy="'+b.id+'">购买 '+b.name+' · '+COST[b.id]*100+' 金币</button>').join('')+(run?'<button id="buyWood">100 木材 · 500 金币</button>':'')+'</div>',
      [['单抽',()=>recruit(1)],['十连',()=>recruit(10)],['去建造',()=>{drawer(true);paintTools();},true],['返回海面',()=>{},true]]);
    document.querySelectorAll('[data-buy]').forEach(button=>button.addEventListener('click',()=>{
      const id=button.dataset.buy;stock[id]=(stock[id]||0)+1;openShop([{id,rarity:Object.keys(POOLS).find(r=>POOLS[r].includes(id))}]);
    }));
    if($('#buyWood')) $('#buyWood').addEventListener('click',()=>{run.wood+=100;openShop();announce('已购买 100 木材 · 测试金币无限');});
  }
  $('#shopBtn').addEventListener('click',()=>openShop());

  // 每天列出"从这里真正能到的"航点——昨天的选择已经砍掉了一部分选项。
  function chooseRoute() {
    if(!run || run.phase!=='build') return;
    SFX.play('sail');
    const opts=reachableNodes();
    const rows=opts.map(node=>{
      if(node.kind==='supply') return supplyRow(node);
      if(node.kind==='event') return eventRow(node);
      return sailRow(forecast(node.kind==='elite'),node);
    }).join('');
    const stat=forecast(opts.some(n=>n.kind==='elite'));
    const types=opts.map(n=>KIND_NAME[n.kind]).join(' / ');
    showJourney(run.day===5?'第五天 · 迎战深海巨兽':'第 '+run.day+' 天 · 选一条航道',
      seaChart()+
      '<p class="chart-legend">金线＝走过的航路 · 金圈＝今天能去 · 方块＝补给 · 菱形＝事件 · 红＝险航</p>'+
      '<p class="powers">攻击 <b>'+stat.attack+'</b> · 每轮护盾 <b>'+stat.shield+'</b> · 捕鱼 <b>'+stat.income+'</b>'+
      ' · 今天有 '+opts.length+' 条航道（'+types+'）</p>'+
      '<div class="sail-list">'+rows+'</div>'+
      '<small>航线是单向的：走上一条道，明天就只能去它连着的地方。鼠标停在船票上，图上会同时亮出这条道的来处和去向。</small>',
      [['返回整备',()=>{},true]]);
    const chartEl=document.querySelector('#chart');
    const light=id=>{
      if(!chartEl) return;
      chartEl.querySelectorAll('.edge').forEach(e=>{
        e.classList.toggle('lit', e.dataset.to===id || e.dataset.from===id);
      });
      chartEl.querySelectorAll('.node').forEach(n=>n.classList.toggle('lit', n.dataset.id===id));
    };
    const dim=()=>{
      if(!chartEl) return;
      chartEl.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));
    };
    document.querySelectorAll('.sail-row').forEach(row=>{
      const id=row.dataset.node;
      row.addEventListener('mouseenter',()=>light(id));
      row.addEventListener('focus',()=>light(id));
      row.addEventListener('mouseleave',dim);
      row.addEventListener('blur',dim);
      row.addEventListener('click',()=>{
        const node=NODE_MAP[id];
        if(!run || run.phase!=='build' || !node) return;
        journey.close();
        if(node.kind==='supply') enterSupply(node);
        else if(node.kind==='event') enterEvent(node);
        else resolveBattle(node);
      });
    });
  }
  function nextDay() {
    // 只允许从结算推进一次；连点不会把天数推两格，也不会让航线与天数脱节
    if(!run || run.phase!=='result') return;
    run.day++; run.phase='build'; delete run.result;
    // 新的一天开始新的整备：清空撤销栈，避免把已领取的战斗奖励退回去
    clearUndo(); held=null; setMoving(false); setRemoving(false);
    paint();
    announce('第 '+run.day+' 天：可建造、修船，准备好再出航。');
    SFX.play('day');
  }
  // 补给点：不上战场，停靠就搬东西。三选一，选完立刻起航。
  function enterSupply(node) {
    if(!run || run.phase!=='build') return;
    const day=run.day, wood=26+day*12, heal=16+day*5;
    const pool=Object.keys(MAP).filter(id=>MAP[id].cat);
    const gift=pool[Math.floor(rnd()*pool.length)];
    run.route.push({day:day,node:node.id});
    run.phase='result';
    run.result={node:node.id,kind:'supply'};
    const crate='<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="26" width="40" height="26" rx="3" fill="#c9a05c"/><path d="M12 34h40M32 26v26" stroke="#7d5a2a" stroke-width="2.5"/><path d="M22 26q0-10 10-10t10 10" fill="none" stroke="#e8d9ac" stroke-width="3"/></svg>';
    const hammer='<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="30" width="26" height="8" rx="2" transform="rotate(-38 29 34)" fill="#c9a05c"/><path d="M34 26l10 10 8-8-10-10z" fill="#9fb08c"/><path d="M20 44l8 8" stroke="#7d5a2a" stroke-width="4" stroke-linecap="round"/></svg>';
    const opts=[
      {id:'wood',   title:'漂流木材', desc:'+'+wood+' 木材，直接堆上甲板', art:crate,   apply:()=>{run.wood+=wood;}},
      {id:'repair', title:'补漏水舱', desc:'船体 +'+heal+'（上限 100）',   art:hammer,  apply:()=>{run.hp=Math.min(100,run.hp+heal);}},
      {id:'build',  title:'漂来的残骸', desc:MAP[gift].name+' ×1 进仓库，建造时免木材', art:model(gift), apply:()=>{stock[gift]=(stock[gift]||0)+1;}}
    ];
    showJourney('第 '+day+' 天 · 漂流补给',
      '<p>这条航道上没有海怪，只有一截翻着白肚的货舱。你能带走的东西有限。</p>'+
      '<p class="loot-title">三选一</p>'+
      '<div class="loot-grid">'+opts.map(o=>'<button class="loot-card build" data-supply="'+o.id+'">'+o.art+'<b>'+o.title+'</b><small>'+o.desc+'</small></button>').join('')+'</div>',
      [['继续航行',()=>nextDay()]]);
    const next=document.querySelector('#journeyActions button');
    if(next){ next.disabled=true; next.textContent='先拿一样东西'; next.classList.add('waiting'); }
    document.querySelectorAll('[data-supply]').forEach(card=>card.addEventListener('click',()=>{
      const got=opts.find(o=>o.id===card.dataset.supply);
      got.apply();
      SFX.play('pick');
      document.querySelectorAll('[data-supply]').forEach(c=>{
        c.disabled=true;
        c.classList.toggle('picked',c.dataset.supply===got.id);
        c.classList.toggle('dim',c.dataset.supply!==got.id);
      });
      const titleEl=document.querySelector('.loot-title');
      if(titleEl) titleEl.textContent='已装船：'+got.title;
      if(next){ next.disabled=false; next.textContent='继续航行'; next.classList.remove('waiting'); next.focus(); }
      paint();
    }));
  }
  // 航路事件：两个选项各有代价，结算一次后必须起航，不能反复领取
  const EVENTS={
    lamp:{
      title:'海雾里的灯影',
      teaser:'雾里有一盏不该存在的灯，底下压着一截货舱',
      body:'雾里有一盏灯，随着浪一起晃。它挂在半沉的桅杆上，下面好像压着一截货舱——靠过去要穿过一片暗礁。',
      choices:[
        {id:'follow',title:'循灯过去',desc:'捞起一件漂来的建筑（进仓库），船体 −8',apply(){
          const pool=Object.keys(MAP).filter(id=>MAP[id].cat);
          const gift=pool[Math.floor(rnd()*pool.length)];
          stock[gift]=(stock[gift]||0)+1;
          run.hp=Math.max(1,run.hp-8);
          return '你捞到 '+MAP[gift].name+'（已进仓库），船身被暗礁刮掉 8 点。';
        }},
        {id:'avoid',title:'绕开灯影',desc:'不冒这个险，什么也拿不到',apply(){
          return '你让木筏从灯的侧面漂过去，什么也没发生。';
        }}
      ]
    },
    storm:{
      title:'风暴前夜',
      teaser:'明早就是巨兽海沟：今晚补船，还是抢最后的物资',
      body:'气压在往下掉。前面就是巨兽海沟，今晚只够做一件事：要么补漏，要么抢货。',
      choices:[
        {id:'plunder',title:'顶着风浪抢货',desc:'木材 +55，船体 −14',apply(){
          run.wood+=55;run.hp=Math.max(1,run.hp-14);
          return '你们把漂来的货捆上甲板：木材 +55，船体 −14。';
        }},
        {id:'mend',title:'落帆补漏',desc:'船体 +20（上限 100）',apply(){
          run.hp=Math.min(100,run.hp+20);
          return '整夜补漏，天亮时船体是 '+run.hp+'。';
        }}
      ]
    }
  };
  function enterEvent(node) {
    if(!run||run.phase!=='build')return;
    const def=EVENTS[node.event];
    if(!def)return;
    const day=run.day;
    run.route.push({day:day,node:node.id});
    run.phase='result';
    run.result={node:node.id,kind:'event'};
    const cards=def.choices.map(c=>'<button class="loot-card" data-event="'+c.id+'"><b>'+c.title+'</b><small>'+c.desc+'</small></button>').join('');
    showJourney('第 '+day+' 天 · '+def.title,
      '<p>'+def.body+'</p><div class="loot-grid two">'+cards+'</div>',
      [['继续航行',()=>nextDay()]]);
    const next=document.querySelector('#journeyActions button');
    if(next){ next.disabled=true; next.textContent='先做一个选择'; next.classList.add('waiting'); }
    document.querySelectorAll('[data-event]').forEach(card=>card.addEventListener('click',()=>{
      if(run.result.picked)return;
      const choice=def.choices.find(c=>c.id===card.dataset.event);
      if(!choice)return;
      const note=choice.apply();
      SFX.play('pick');
      run.result.picked=choice.id;
      document.querySelectorAll('[data-event]').forEach(c=>{
        c.disabled=true;
        c.classList.toggle('picked',c.dataset.event===choice.id);
        c.classList.toggle('dim',c.dataset.event!==choice.id);
      });
      const lead=document.querySelector('#journeyBody p');
      if(lead) lead.textContent=note;
      if(next){ next.disabled=false; next.textContent='继续航行'; next.classList.remove('waiting'); next.focus(); }
      paint();
    }));
  }

  let battle = null;
  function resolveBattle(node) {
    if(!run || run.phase!=='build') return;
    const elite=node.kind==='elite';
    saveProgress();
    const f=forecast(elite), before=run.hp;
    run.route.push({day:run.day,node:node.id});
    run.phase='battle';

  // Inspired by Tidewater's guarded, versioned local saves; this schema is specific to our run.
  function validSave(d) {
    const integer=(v,min,max)=>Number.isSafeInteger(v)&&v>=min&&v<=max;
    if(!d||d.version!==SAVE_VERSION)return false;
    if(!integer(d.sizeIdx,0,2)||!integer(d.pity,0,19)||typeof d.soundEnabled!=='boolean'||typeof d.guideEnabled!=='boolean')return false;
    const r=d.run,n=SIZES[d.sizeIdx].n;
    if(!r||!integer(r.day,1,5)||!integer(r.hp,0,100)||!integer(r.wood,0,1e9)||!['build','result'].includes(r.phase))return false;
    if(r.seed!==undefined&&!integer(r.seed,0,4294967295))return false;
    if(r.phase==='build'&&r.hp===0)return false;
    if(!Array.isArray(r.route)||r.route.length!==r.day-(r.phase==='build'?1:0))return false;
    if(r.route.some((v,i)=>{
      if(!v||v.day!==i+1||typeof v.node!=='string'||!NODE_MAP[v.node])return true;
      const node=NODE_MAP[v.node];
      if(node.day!==v.day)return true;
      // 上一站必须真的连到这一站，否则就是改过的存档
      if(i===0) return node.day!==1;
      return NODE_MAP[r.route[i-1].node].links.indexOf(v.node)<0;
    }))return false;
    if(r.phase==='result'&&(!r.result||!integer(r.result.before,1,100)||typeof r.result.node!=='string'||r.result.node!==r.route.at(-1).node))return false;
    if(!Array.isArray(d.cells)||d.cells.length>n*n)return false;
    const keys=new Set();
    for(const cell of d.cells) {
      if(!Array.isArray(cell)||cell.length!==2||typeof cell[0]!=='string'||typeof cell[1]!=='string'||!/^\d,\d$/.test(cell[0])||!Object.hasOwn(MAP,cell[1]))return false;
      const [x,y]=cell[0].split(',').map(Number);
      if(x>=n||y>=n||keys.has(cell[0]))return false;keys.add(cell[0]);
    }
    if(!d.stock||typeof d.stock!=='object'||Array.isArray(d.stock))return false;
    return Object.entries(d.stock).every(([id,count])=>Object.hasOwn(MAP,id)&&integer(count,0,1e9));
  }
  // 旧版存档里 route 只记了 day + elite，按"同类且连得上"的规则补成航点
  function repairRoute(d) {
    if(!d||!d.run||!Array.isArray(d.run.route))return d;
    if(d.run.route.every(v=>v&&typeof v.node==='string'))return d;
    const out=[];
    for(const v of d.run.route) {
      const prev=out.length?NODE_MAP[out[out.length-1].node]:null;
      const from=prev?prev.links:MAP_NODES.filter(n=>n.day===1).map(n=>n.id);
      const cands=from.map(id=>NODE_MAP[id]).filter(n=>n&&n.day===v.day);
      const want=v.elite?'elite':'fight';
      const pick=cands.find(n=>n.kind===want)
        ||cands.find(n=>n.kind==='fight'||n.kind==='elite')
        ||cands[0];
      if(!pick)break;
      out.push({day:pick.day,node:pick.id});
    }
    d.run.route=out;
    if(d.run.result&&typeof d.run.result.node!=='string'){
      const last=out[out.length-1];
      d.run.result.node=last?last.node:null;
      if(last)d.run.result.elite=NODE_MAP[last.node].kind==='elite';
    }
    return d;
  }
  // 版本阶梯：每级只负责把上一版的数据补齐到本级，之后由 validSave 统一验收
  const MIGRATIONS={
    // v2：存档带上写入时间，用于"继续游戏"显示存档时刻，并提供多窗口冲突的可读来源
    1(d){ d.version=2; if(!Number.isSafeInteger(d.savedAt))d.savedAt=0; return d; }
  };
  function migrateSave(d) {
    if(!d||typeof d!=='object')return d;
    d=repairRoute(d);
    let v=Number.isSafeInteger(d.version)?d.version:0;
    while(v<SAVE_VERSION&&MIGRATIONS[v]) { d=MIGRATIONS[v](d); v=d.version; }
    return d;
  }
  // 只比较内容（不含写入时间），避免每次保存都因时间戳不同而重复写盘
  function contentOf(d) {
    return JSON.stringify({version:SAVE_VERSION,sizeIdx:d.sizeIdx,cells:d.cells,stock:d.stock,pity:d.pity,run:d.run,soundEnabled:d.soundEnabled,guideEnabled:d.guideEnabled});
  }
  function saveBody() {
    return {version:SAVE_VERSION,sizeIdx,cells:[...cells],stock,pity,run,soundEnabled,guideEnabled};
  }
  const stampOf=ms=>{if(!ms)return '';const t=new Date(ms);const p=n=>String(n).padStart(2,'0');return (t.getMonth()+1)+'/'+t.getDate()+' '+p(t.getHours())+':'+p(t.getMinutes());};
  function readSave() {
    try {
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw)return;
      if(raw.length>100000)throw new Error('oversized save');
      const d=migrateSave(JSON.parse(raw));
      if(!validSave(d))throw new Error('invalid save');
      savedGame=d;lastSaved=contentOf(d);
      // 旧版存档读入后立刻落盘，避免每次启动都重新迁移
      if(JSON.parse(raw).version!==SAVE_VERSION) {
        try { localStorage.setItem(SAVE_KEY,JSON.stringify({...d,savedAt:d.savedAt||Date.now()})); } catch {}
      }
    } catch {saveMessage='存档不可读取，原数据保留；可开始新局';}
  }
  function saveProgress() {
    if(!run||!['build','result'].includes(run.phase))return;
    // 补给/事件停靠是内存里的暂停：此刻的 result 快照没有战报字段，写进去下次读档会被判非法。
    // 等 nextDay() 回到整备阶段再落盘；中途刷新最多重挑一次，不会重复领取。
    if(run.result&&(run.result.kind==='supply'||run.result.kind==='event'))return;
    const body=saveBody(), raw=contentOf(body);
    if(raw===lastSaved)return;
    // 写盘前先自己过一遍校验：宁可这一秒不保存，也不要把读不回来的档写进 localStorage
    if(!validSave(body)) { saveMessage='进度暂时无法保存'; return; }
    try {
      localStorage.setItem(SAVE_KEY,JSON.stringify({...body,savedAt:Date.now()}));
      lastSaved=raw;savedGame=body;saveMessage='已存 '+stampOf(Date.now()).slice(-5);
    } catch {saveMessage='无法保存，请勿关闭本页';}
  }
  // 多窗口：另一个标签页写了不同进度时只提示，不静默覆盖当前这一局
  window.addEventListener('storage',ev=>{
    if(ev.key!==SAVE_KEY||!ev.newValue)return;
    let d;
    try { d=migrateSave(JSON.parse(ev.newValue)); } catch { return; }
    if(!validSave(d))return;
    const incoming=contentOf(d);
    if(run&&incoming===contentOf(saveBody())) { lastSaved=incoming; return; }
    if(!run) {
      savedGame=d;lastSaved=incoming;
      saveMessage='已同步另一窗口'+(d.savedAt?' · '+stampOf(d.savedAt):'');
      announce('另一窗口的进度已同步到此页。');
      paint();
      if($('#journey').open&&$('#journeyBody').dataset.view==='welcome')welcome();
      return;
    }
    conflictSave=d;
    saveMessage='另一窗口有不同进度';
    paint();
    announce('另一个窗口保存了不同进度，本页不会被静默覆盖。点“怎么玩”可选择载入那一份。');
    if($('#journey').open&&$('#journeyBody').dataset.view==='welcome')welcome();
  });
  function resumeGame(source) {
    const base=source&&validSave(source)?source:savedGame;
    if(!base||!validSave(base))return;
    const d=JSON.parse(JSON.stringify(base));
    saveMessage='已恢复存档'+(d.savedAt?' · 整备于 '+stampOf(d.savedAt):'');
    sizeIdx=d.sizeIdx;N=SIZES[sizeIdx].n;stock=d.stock;pity=d.pity;run=d.run;
    if(!Number.isInteger(run.chapter)) run.chapter=meta.chapter;
    if(Number.isSafeInteger(d.run.seed)) seedState=d.run.seed;
    soundEnabled=d.soundEnabled;guideEnabled=d.guideEnabled;
    cells.clear();for(const [k,id] of d.cells)cells.set(k,id);
    selected=null;hover=null;preview=null;noGhostKey=null;held=null;
    setMoving(false);setRemoving(false);clearUndo();conflictSave=null;
    $('#growBtn').disabled=sizeIdx===2;
    $('#soundBtn').textContent='音效：'+(soundEnabled?'开':'关');$('#soundBtn').setAttribute('aria-pressed',String(soundEnabled));
    SFX.setEnabled(soundEnabled);
    buildTools();buildGrid();paint();
    if(run.phase==='result')presentResult(forecast(run.result.elite),run.result.before);
    else announce('已恢复第 '+run.day+' 天的木筏、仓库和保底进度。');
  }
  $('#miniMap').addEventListener('click',chooseRoute);
  $('#coachClose').addEventListener('click',()=>{guideEnabled=false;paint();});
  $('#helpBtn').addEventListener('click',()=>{guideEnabled=true;paint();});
  $('#soundBtn').addEventListener('click',saveProgress);

  // ---------------- 启动 ----------------
  // 数值核对出口：自动化测试与平衡调试用，不影响正常游玩
  window.__ff={ simulate, forecast, encounter, fleet, MONSTERS, monsterArt, RELICS, rewardOptions, applyReward, relicBonus, paint,
    MAP_NODES, NODE_MAP, KIND_NAME, reachableNodes, hereNode, routeNodes, validSave, migrateSave,
    undoLast, moveBuilding, get undoDepth(){return undoStack.length;}, SAVE_VERSION,
    get seed(){return seedState;}, setSeed(v){seedState=v>>>0; if(run)run.seed=seedState;},
    get stock(){return stock;},
    get meta(){return meta;}, resetMeta(){meta={level:1,xp:0,chapter:1,highest:1};saveMeta();}, setLevel(v){meta.level=v;saveMeta();paintTools();}, setChapter(v){meta.chapter=v;saveMeta();}, setHighest(v){meta.highest=v;saveMeta();},
    get run(){return run;}, set run(v){run=v;}, SFX };
  readSave();
  buildTools();
  buildGrid();
  applyPreset('beacon',true);
  clearUndo();
  welcome();
})();
</script>
</body>
